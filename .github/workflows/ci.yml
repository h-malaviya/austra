name: CI

on:
  pull_request:
  push:
    branches:
      - 'codex/**'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: node --check src/austra/static/app.js
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: git diff --exit-code -- src/austra/static/a2ui.bundle.js
