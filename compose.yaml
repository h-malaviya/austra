name: austra

services:
  app:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AUSTRA_PORT:-8000}:8000"
    environment:
      AUSTRA_WORKSPACE: /data/blank
      AUSTRA_COMPOSE_FILE: /app/compose.yaml
      AUSTRA_COMPOSE_PROJECT: austra
      AUSTRA_DOCKER_PROXY: "1"
      AUSTRA_PUBLIC_URL: "http://127.0.0.1:${AUSTRA_PORT:-8000}"
      AUSTRA_DATABASE_URL: "postgresql://austra:${AUSTRA_DB_PASSWORD}@db:5432/austra"
    volumes:
      - ./data/blank:/data/blank
      - ./compose.yaml:/app/compose.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/config', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: austra
      POSTGRES_USER: austra
      POSTGRES_PASSWORD: ${AUSTRA_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U austra -d austra"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: [cache]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

  mongo:
    image: mongo:8
    profiles: [nosql]
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15
    profiles: [vector]
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  qdrant_data:
