name: austra

services:
  app:
    build: .
    ports:
      - "127.0.0.1:${AUSTRA_PORT:-8001}:8000"
    environment:
      AUSTRA_WORKSPACE: /data/blank
      AUSTRA_COMPOSE_FILE: /app/compose.yaml
      AUSTRA_COMPOSE_PROJECT: austra
      AUSTRA_DOCKER_PROXY: "1"
    volumes:
      - ./data/blank:/data/blank
      - ./compose.yaml:/app/compose.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/config', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: [cache]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

  mongo:
    image: mongo:8
    profiles: [nosql]
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15
    profiles: [vector]
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  redis_data:
  mongo_data:
  qdrant_data:
