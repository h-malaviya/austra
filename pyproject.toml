[project]
name = "austra"
version = "0.1.0"
description = "Chat guided blank business workspace"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.118",
    "httpx>=0.28",
    "jsonschema>=4.25",
    "pypdf>=6.20.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.37",
    "websockets>=15,<17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/austra"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
