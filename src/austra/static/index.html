<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Austra · Blank workspace</title>
  <link rel="stylesheet" href="/static/app.css?v=11">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Conversations">
      <div class="brand"><span class="brand-mark">A</span><span>Austra<small>Business workspace</small></span></div>
      <button class="new-chat" id="newChat" type="button">＋ New chat</button>
      <div class="sidebar-label">YOUR CHATS</div>
      <nav class="chat-list" id="chatList" aria-label="Previous chats"></nav>
      <div class="sidebar-bottom">
        <button class="side-action" id="infrastructureButton" type="button">Infrastructure <span>↗</span></button>
        <button class="side-action" id="connectionsButton" type="button">Connections <span>↗</span></button>
        <button class="side-action" id="logoutButton" type="button">Sign out <span>↗</span></button>
        <div class="connection" id="connection">Checking setup…</div>
      </div>
    </aside>
    <main class="chat-area" id="chatArea">
      <header class="topbar">
        <button class="mobile-menu icon-button" id="menuButton" type="button" aria-label="Open chats">☰</button>
        <div class="chat-heading"><strong id="chatTitle">New chat</strong><span>Skills and structures grow from your instructions</span></div>
        <button class="top-action" id="topConnections" type="button">Connections</button>
      </header>
      <div class="messages" id="messages" role="log" aria-live="polite"></div>
      <div class="composer-wrap">
        <div class="status" id="status" role="status"></div>
        <div class="active-processes" id="activeProcesses" role="status" aria-live="polite" hidden></div>
        <div class="attachment-preview" id="attachmentPreview" aria-live="polite" hidden></div>
        <div class="composer">
          <button class="attach-button icon-button" id="attachButton" type="button" aria-label="Attach a business document or spreadsheet">＋</button>
          <input id="fileInput" type="file" accept=".pdf,.docx,.csv,.txt,.md,.xlsx" multiple hidden>
          <textarea id="messageInput" rows="1" aria-label="Message Austra" placeholder="Describe your business or ask Austra to build something…"></textarea>
          <button class="send-button" id="sendButton" type="button" aria-label="Send message">➤</button>
        </div>
        <p class="composer-hint">Enter to send · Shift+Enter for a new line · Never paste API keys here</p>
      </div>
    </main>
    <main class="connections-page" id="connectionsPage" hidden>
      <header class="connections-header">
        <div><span class="eyebrow">SETTINGS</span><h1>Connections</h1><p>Manage and verify the apps Austra can use.</p></div>
        <button class="top-action" id="backToChat" type="button">← Back to chat</button>
      </header>
      <div class="connections-layout">
        <nav class="connection-list" id="connectionList" aria-label="Available apps"></nav>
        <section class="connection-detail" id="connectionDetail" aria-live="polite"></section>
      </div>
    </main>
  </div>
  <script src="/static/markdown.js?v=8" defer></script>
  <script src="/static/app.js?v=12" defer></script>
</body>
</html>
